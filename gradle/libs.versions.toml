[versions]
kotlin = "2.2.0"
agp = "8.12.0"
compose = "1.9.0-beta01"
compose-material3 = "1.9.0-alpha04"
androidx-lifecycle = "2.9.1"
androidx-navigation = "2.9.0-beta04"
kotlinx-collections-immutable = "0.4.0"
kotlinCss = "2025.8.6"
atomicfu = "0.29.0"
coil = "3.3.0"
kobweb = "0.23.0"
okio = "3.16.0"
beercss = "3.11.33"
binaryCompatibility = "0.18.1"
mavenPublish = "0.34.0"

[libraries]
compose-ui-unit = { module = "org.jetbrains.compose.ui:ui-unit", version.ref = "compose" }
compose-ui-graphics = { module = "org.jetbrains.compose.ui:ui-graphics", version.ref = "compose" }
compose-ui-geometry = { module = "org.jetbrains.compose.ui:ui-geometry", version.ref = "compose" }
compose-ui-text = { module = "org.jetbrains.compose.ui:ui-text", version.ref = "compose" }
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "compose-material3" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-common = { module = "org.jetbrains.androidx.navigation:navigation-common", version.ref = "androidx-navigation" }
androidx-navigation-runtime = { module = "org.jetbrains.androidx.navigation:navigation-runtime", version.ref = "androidx-navigation" }
androidx-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections-immutable" }
kotlin-css = { module = "org.jetbrains.kotlin-wrappers:kotlin-css", version.ref = "kotlinCss" }
kobweb-core = { module = "com.varabyte.kobweb:kobweb-core", version.ref = "kobweb" }
kobweb-compose-js = { module = "com.varabyte.kobweb:kobweb-compose-js", version.ref = "kobweb" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

#Plugin
plugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
plugin-kotlin-multiplatform = { module = "org.jetbrains.kotlin.multiplatform:org.jetbrains.kotlin.multiplatform.gradle.plugin", version.ref = "kotlin" }
plugin-kotlin-compose-compiler = { module = "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin", version.ref = "kotlin" }
plugin-kotlin-compose-multiplatform = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose" }
plugin-kotlin-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu-gradle-plugin", version.ref = "atomicfu" }
plugin-mavenPublish = { module = "com.vanniktech.maven.publish:com.vanniktech.maven.publish.gradle.plugin", version.ref = "mavenPublish" }

[plugins]
binaryCompatibility = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibility" }